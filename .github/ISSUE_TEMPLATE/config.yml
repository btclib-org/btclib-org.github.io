---
# The new-issue page of this repository. The forms beside this file are
# the kinds of issue this tree takes -- the site's configuration, the
# derivation and the workflows -- and the links below are for what has a
# better address than any of them.
#
# Blank issues are off: a question has a form of its own here, which is
# what a blank box would otherwise be the only home for.
#
# A `contact_links` url is absolute -- the schema for this file admits
# only `^https?://` -- so each names one address and none of them
# resolves against this tree. That is why the second entry names the
# organization's tracker rather than the page the text lives in: the
# text is one file in one repository, and its tracker is where a reader
# of the site is sent.
blank_issues_enabled: false
contact_links:
  # first, because a vulnerability is the one report that must not be
  # filed as an issue at all
  - name: Security vulnerability
    url: https://github.com/btclib-org/btclib-org.github.io/security/advisories/new
    about: >
      Never a public issue. This opens a private advisory, visible to
      the maintainers alone; the policy on the Security tab, which this
      repository inherits from the organization, gives an email address
      for anyone who would rather not use it.
  - name: What the homepage says
    url: https://github.com/btclib-org/.github/issues
    about: >
      index.md is btclib-org/.github's profile/README.md under front
      matter, so the text of the page is written there and corrected
      there. So is an issue the standard owns or one that spans
      repositories, which is CONTRIBUTING.md's *The issue tracker*.
  - name: A defect in the software the site links
    url: https://github.com/btclib-org
    about: >
      Every repository of the organization keeps its own tracker, and a
      defect in one of them is filed against that repository rather than
      against the site that links it.
