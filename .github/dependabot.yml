---
# two ecosystems, because two is what this tree has: the actions the
# workflows pin, and the one gem the Gemfile names. There is no manifest
# and no lock file besides -- `git ls-files 'pyproject.toml' 'uv.lock'`
# is empty -- and the pre-commit hook revisions are the other thing this
# repository pins and are not below, dependabot having no pre-commit
# ecosystem: the `ci:` block of .pre-commit-config.yaml has pre-commit.ci
# bumping them weekly instead.
#
# No target-branch: without one dependabot opens against the default
# branch, which is the only branch a change lands on -- and a
# target-branch naming a branch that is not there is not an error
# anywhere, it is a repository where nothing is ever proposed.
#
# The seven-day cooldown is what the weekly interval is really trading
# against: a compromised release is usually yanked within days, and
# nothing is offered here before it has been public a week. The interval
# decides how long after that week the offer arrives, not whether it
# waits at all.
version: 2
updates:
  # every action in .github/workflows is pinned to a commit SHA, and
  # nothing but this moves one: without it a pin is frozen for good, and
  # a fix -- or an advisory -- upstream never reaches this repository.
  #
  # Grouped, so an update week is one pull request rather than one per
  # action: every one of them runs the lint gate, and reading a group is
  # the same reading as one entry plus a diff
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Thursday, which is the day section 10 of btclib-org/.github's
      # README.md gives dependabot across the organization. Actions move
      # rarely, so a week where none did opens no pull request at all
      day: thursday
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # the Gemfile, which is the site rather than this repository: one gem,
  # github-pages, pinned to the release GitHub's own Pages builder runs.
  # Nothing installs it to serve the site -- that build happens on
  # GitHub's side -- so what a bump means here is that the builder itself
  # moved, and website.yml is what then answers whether the site still
  # renders under it. Ungrouped, a single gem having nothing to group
  # with, and the cooldown left at the same week: this one tracks a
  # release GitHub has already deployed, so the week is a formality
  # rather than a quarantine
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
