---
name: claude-review

# Claude reading a pull request against REVIEWING.md, which is the standard
# a review here is written against. The prompt, the credential guard, the
# action, the verdict check and the @claude answer are
# `btclib-org/.github`'s `reusable-claude-review.yml`, called at `@main` so
# a fix there reaches this tree in one landing (issue btclib-org/.github#35).
# What stays here is the trigger, the concurrency group, the
# workflow-level permissions and the header saying why this repository
# runs a review at all -- the callee's own says so.
#
# What it is here for is the ack of record. Section 11 of the
# organization's standard says the author does not supply their own, and
# this repository has one maintainer -- so without this the only reading
# a pull request can get is the one its author wrote.
#
# Not a required check, and it must not become one. What it produces is a
# review of type COMMENT, an opinion for the author to weigh; a review
# that gated a merge would make a model's judgement a branch rule. A
# review of type COMMENT supplies no approving review count, so this
# workflow is not a route to the one a branch rule asks for, and
# REPOSITORY.md is where what holds a merge here is read back from the
# endpoint. What this buys instead is the reading a human weighs before
# pressing merge, chosen over a second human approving every pull request
# because nothing would land while nobody is available.
#
# One calling job, not two: a `uses:` job invokes the *whole* called
# workflow, every job in it, so this one job already reaches both the
# callee's `review` and `mention`, and each declines the events that are
# not its own -- the callee's own header states this in the singular. A
# calling job per callee job would not double-fire, but it would state
# the event dispatch twice, in this file's own `if:` and the callee's
# job `if:`, and duplicate the permissions triple, the secrets block and
# the `uses:` line for no reason a third callee job would not then
# triple.
#
# CLAUDE_REVIEW_ENABLED is the switch, an *organization* variable read
# inside the callee's own jobs; section 11's *Review* is where what it
# does is stated rather than here a second time.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # callee's draft condition withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request would
    # wait for its next push to be reviewed at all.
    # closed too: the group below is at the workflow level, so a closed
    # run enters it when the run is created, before any job's own `if:`
    # is read, and can cancel a review still holding the group -- what
    # declines the actual review on a closed pull request is the
    # callee's own job-level `if:`
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the job below and
# nowhere else
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here, and at the workflow level rather than on the job below: with one
# calling job that carries no `if:` of its own, a job-level group would
# claim the same slot at the same moment, so this is not the fix -- moving
# the key itself is. `github.event.pull_request.number` alone is empty on
# an issue_comment event, which is the mention's, so every mention in the
# repository would land in one bare "claude-review-" group and cancel each
# other; and a pull_request_review_comment event carries
# github.event.pull_request.number too, so the number alone would also
# put a mention answer in the review's own group, letting either cancel
# the other. github.event_name tells the two apart -- true only for a
# pull_request event, so a review keys on the pull request's number and a
# push supersedes the review it overtakes. Every other event falls back
# to github.run_id, which no two runs share, so cancel-in-progress below
# is inert for the mention. The key is btclib-secp256k1's, decided at
# btclib-org/btclib-secp256k1#593
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    # restated here because a called workflow's own `permissions:` can
    # only downgrade what the caller granted, never restore an omitted
    # scope -- btclib-org/.github#912 is where that is measured, and the
    # callee's own header states the triple its two jobs need:
    # `pull-requests: write` for posting the review or the reply,
    # `id-token: write` for the OIDC token the action mints during its
    # own startup
    permissions:
      contents: read
      pull-requests: write # posting the review, and the reply to a mention
      id-token: write # the OIDC token the action mints at its own startup
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    with:
      # this tree's own paragraph, landing between the verdict paragraph
      # and the callee's "Do not run the gates" -- the callee's one
      # insertion point for it. It names nothing the callee drops: what
      # it points at is REVIEWING.md's last section, which stays this
      # tree's own file regardless of which workflow calls the action
      extra-prompt: |
        What this repository ships is a GitHub Pages site.
        index.md is its homepage and is generated from
        btclib-org/.github's profile/README.md, so a diff that
        edits it by hand is a finding whatever the checks say;
        REVIEWING.md's last section has that question and the
        others this tree adds.
      # no extra-allowed-tools, passed nothing rather than an empty
      # string: nothing this tree's prompt asks for reaches beyond the
      # tools every caller gets, and an explicit empty value would say
      # something the absence does not
    # named rather than `secrets: inherit`: the callee declares only
    # CLAUDE_CODE_OAUTH_TOKEN as required, and zizmor's secrets-inherit
    # audit is what flags the blanket form for handing the callee every
    # secret this repository holds to reach the one it needs
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
