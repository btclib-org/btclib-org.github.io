---
name: homepage

# index.md is generated from btclib-org/.github's profile/README.md, and
# .github/scripts/derive-homepage.sh is what generates it. This is the
# pair of questions that mechanism needs somebody to keep asking:
#
#   verify -- are the committed index.md and the images it shows what
#     its own pin derives to? A hand edit is then a refusal rather than a
#     convention, which is the whole reason the file records the commit
#     it came from.
#   stale  -- does btclib-org/.github's profile/README.md still show what
#     this site shows? The pin is a commit, so it goes out of date on
#     every landing there; what matters is the page, and that is what
#     this compares.
#
# They run on different events because they answer to different people.
# verify is about the branch in front of you and runs on a pull request
# that touches what it reads -- its own if: does not exclude the
# schedule below either, so it re-checks index.md there too. stale is
# about another repository moving, which no pull request here introduces
# and no merge here should wait on -- so it runs on main, on demand and
# on that same schedule, and a red run of it is a notification rather
# than a gate.
# CONTRIBUTING.md's "Changing the homepage" is what answers it: the
# derivation, and _config.yml's projects list where what moved upstream
# was the organization's set of repositories.
#
# The schedule is what runs stale without anybody asking: nothing else
# here notices that profile/README.md has moved on its own, and neither
# a push nor a dispatch here is guaranteed to follow it soon after.
# Section 10 of the organization's standard is the calendar that names
# the instant -- one table gives `homepage` its day and hour, the other
# gives this repository its minute -- and tests/grid_test.py there
# compares this file's cron: against it.

on:
  schedule:
    # the instant is section 10 of btclib-org/.github's to name and not
    # this file's to restate: one of its two tables gives this workflow
    # its day and hour, the other gives this repository its minute, and
    # tests/grid_test.py there is red on a schedule no row names.
    # Only the default branch schedules workflows, so on any other
    # branch this is reachable through the dispatch below alone
    - cron: "36 3 * * 6"
  push:
    branches: [main]
  pull_request:
    # closed too, though the jobs below decline the real work on it: the
    # landing then lands in this pull request's own concurrency group and
    # cancels the run still holding it
    types: [opened, reopened, synchronize, ready_for_review, closed]
    # what verify reads of this tree, and this file, so that a change to
    # it is checked by the thing it configures. `*.svg` is the root's
    # alone, where the script writes the images the page shows. A pull
    # request touching none of these cannot change verify's answer, and
    # stale never runs on this event -- its own if: below -- so a list
    # under this key withholds nothing from it and narrows no other
    # trigger. Section 10 of btclib-org/.github's README.md asks a
    # calendar workflow's pull_request for exactly this filter and grants
    # an unfiltered one only for a reason stated in the header; the
    # nearest it names, a required check that would otherwise never run,
    # is not this file's: nothing in it is one, and with the filter none
    # may become one, which REPOSITORY.md's "Required checks on main"
    # reads back
    paths:
      - index.md
      - "*.svg"
      - .github/scripts/derive-homepage.sh
      - .github/workflows/homepage.yml
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN. Nothing here writes: the script
# rewrites a checkout that is thrown away, and what a difference means is
# reported rather than committed
permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow. Keyed on the pull
  # request's number rather than on github.head_ref, which two forks each
  # pushing "patch-1" would share; a run with no pull request falls back
  # to github.ref
  group: homepage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: The homepage is what its pin derives to
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a curl, a gh call and a diff
    timeout-minutes: 10
    steps:
      # every action pinned to a commit SHA with the tag in the comment
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the script reads the network and writes the checkout;
          # nothing pushes it back
          persist-credentials: false
      # read out of the front matter and not out of the body: the body is
      # somebody else's prose and may one day contain a line shaped like
      # a key. awk stops at the second `---`, which is where the front
      # matter ends -- the source's own thematic break is further down
      # and is not counted
      - name: Read the commit index.md records
        id: pin
        run: |
          pin=$(awk '$0=="---"{n++;next} n==1&&$1=="source_commit:"{print $2;exit}' index.md)
          if [ -z "$pin" ]; then
            echo "::error::index.md carries no source_commit in its" \
                 "front matter, so nothing says which text it is."
            exit 1
          fi
          echo "commit=$pin" >> "$GITHUB_OUTPUT"
      # a commit that is in that repository but not on its main is a pin
      # to something nobody landed -- a branch, a fork's head.
      # `compare/<base>...<head>` answers about the *head*, so with the
      # pin as base and main as head it says `ahead` where the pin is an
      # ancestor of main and `identical` where it is main itself; a pin
      # off main answers `diverged`, and a commit that repository does
      # not have at all answers 404, which fails this step on gh's own
      # message. Measured both green ways against btclib-org/.github --
      # `behind` is what the pair answers written the other way round
      - name: The pin names a commit on that repository's main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN: ${{ steps.pin.outputs.commit }}
        run: |
          # `relation` rather than `status`, which zsh reserves: this
          # runs under bash, and the name is what somebody reproducing
          # the step by hand types into whatever shell they have
          relation=$(gh api "repos/btclib-org/.github/compare/$PIN...main" \
                       --jq '.status')
          case "$relation" in
            ahead | identical) echo "the pin is on main ($relation)" ;;
            *)
              echo "::error::index.md pins $PIN, which compares" \
                   "$relation against btclib-org/.github's main: the" \
                   "homepage is derived from a commit nobody landed."
              exit 1
              ;;
          esac
      # the script rewrites index.md whole and writes each image it shows,
      # so what git reports afterwards is every way the committed files
      # differ from what their own pin derives to -- a hand edit to the
      # body, to the front matter or to an image, a pin moved without
      # re-deriving. --intent-to-add is what puts an image nobody
      # committed into that diff
      - name: Re-derive at that commit and compare
        env:
          PIN: ${{ steps.pin.outputs.commit }}
        run: |
          ./.github/scripts/derive-homepage.sh "$PIN"
          git add --intent-to-add --all
          if ! git diff --exit-code; then
            echo "::error::index.md or an image it shows is not what" \
                 "the pin derives to. It is generated: CONTRIBUTING.md's" \
                 "\"Changing the homepage\" is how it is changed, and a correction to" \
                 "what the page says belongs in btclib-org/.github."
            exit 1
          fi

  stale:
    name: The homepage still says what the organization page says
    # never on a pull request: what this reports is that another
    # repository moved, which is nothing a branch here introduced
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the page and not the commit. That repository lands changes for
      # its own reasons every week, so a pin behind its main says
      # nothing; what this site owes is the same text and the same
      # images, and deriving again at main's tip is what answers it.
      # Every difference but the one in the pin's own line is something
      # main shows and this site does not, and --intent-to-add is what
      # puts an image main shows for the first time into that diff
      - name: Derive at that repository's main and compare
        run: |
          main=$(git ls-remote https://github.com/btclib-org/.github main | cut -f1)
          ./.github/scripts/derive-homepage.sh "$main"
          git add --intent-to-add --all
          if ! git diff --exit-code -I '^source_commit: '; then
            echo "::error::btclib-org/.github's profile/README.md, or" \
                 "an image it shows, has moved and this site has not." \
                 "CONTRIBUTING.md's \"Changing the homepage\" is what moves it, the" \
                 "projects hook refusing the derivation alone where a" \
                 "repository was added or dropped."
            exit 1
          fi
