---
name: website

# https://btclib.org/ is this repository's own root. This workflow builds
# the site with the gems `Gemfile` names and, on main, deploys it:
# `gh api repos/btclib-org/btclib-org.github.io/pages` answers
# `build_type: workflow`, and REPOSITORY.md records the setting. Pages
# builds nothing itself, so a layout Jekyll cannot render fails here, out
# loud, before anything is served.
#
# The build job runs on every pull request and every push to main. Its
# check is not a required one: it carries a `paths` filter, and a required
# check that produces no run blocks a merge where a skipped one satisfies
# it. What it buys without being required is a red X on the pull request
# that breaks the site.
#
# The deploy job runs on main only and is the only one holding
# `pages: write` and `id-token: write`, which `actions/deploy-pages`
# needs. The `github-pages` environment it names allows deployments from
# main alone (REPOSITORY.md), so a branch could not deploy even if the
# condition below were wrong.
#
# Dependabot's bundler ecosystem moves `Gemfile` and `Gemfile.lock`, which
# makes a toolchain upgrade a pull request that builds the site with it
# before anything is merged.

on:
  push:
    # main only, for the reason lint.yml gives at the same key: a push to
    # a branch with an open pull request would run this twice, in two
    # concurrency groups that do not cancel each other, and the
    # pull_request run is the one worth keeping. On main it builds and
    # deploys the commit a merge creates
    branches: [main]
    # what a Jekyll build reads, and nothing else. index.md is the homepage,
    # LICENSE is published as it stands,
    # a root `*.svg` an image derive-homepage.sh writes beside it,
    # `*/index.md` the page of a project, _config.yml decides what else in
    # the root is published at all, _layouts holds the theme layout this
    # tree carries its own copy of, assets holds the stylesheet and the
    # images that copy points at. Gemfile.lock sits beside Gemfile because
    # bundler resolves and installs from it before jekyll ever runs. The
    # two scripts are here because the job runs them and each can fail on
    # its own. Written out twice rather than through a yaml anchor, which
    # the workflow parser does not promise
    paths:
      - index.md
      - LICENSE
      - "*/index.md"
      - "*.svg"
      - _config.yml
      - _layouts/**
      - assets/**
      - Gemfile
      - Gemfile.lock
      - .github/scripts/check-theme-copies.sh
      - .github/scripts/check-built-pages.sh
      - .github/workflows/website.yml
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft. closed too,
    # though the job below declines the real work on it: the landing then
    # lands in this pull request's own concurrency group and cancels the
    # run still holding it
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - index.md
      - LICENSE
      - "*/index.md"
      - "*.svg"
      - _config.yml
      - _layouts/**
      - assets/**
      - Gemfile
      - Gemfile.lock
      - .github/scripts/check-theme-copies.sh
      - .github/scripts/check-built-pages.sh
      - .github/workflows/website.yml
  # a run on demand: for a branch whose pull request is not open yet, and
  # on main a redeploy that no file change asks for
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch or pull request, but never on
# main, where a run may be deploying. The group is named literally
# rather than with github.workflow, which in a called workflow is the
# caller's name
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  website:
    name: Build the website
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    # a draft pull request is work in progress and spends no runner here
    # either. A closed one spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a minute of bundler and seconds of jekyll; a job that takes ten is
    # hung rather than slow
    timeout-minutes: 15
    steps:
      # every action is pinned to a commit SHA, the tag in the comment
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the build reads the tree and nothing pushes it back
          persist-credentials: false
      # ruby 4.0, the newest 4.0.x this setup-ruby knows; nothing here has
      # to match GitHub's own builder.
      # bundler-cache installs the gems and caches them, the key
      # carrying Gemfile.lock's own hash alongside the ruby version and
      # the runner image -- ruby/setup-ruby's bundler.js reads that file
      # rather than the Gemfile, so among these the gem set is what moves
      # the key, and that only when dependabot or a local
      # `bundle install` moves the lock
      - name: Set up ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # the theme files this tree keeps its own copies of, which are
      # what a theme bump can falsify in silence: the gem moves, the site
      # still builds, and the page serves the chrome of a release nobody
      # runs, or a stylesheet missing half of itself.
      # Before the build rather than after, this being a question about
      # the sources; the script says which files it compares and how
      # each one's own additions are left out of the comparison
      - name: The theme files this tree copies are the theme's own
        run: .github/scripts/check-theme-copies.sh
      # the Pages settings, from which the build takes its base path. It
      # is empty under the custom domain, and stays right if the domain
      # ever goes
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # PAGES_REPO_NWO and PAGES_PAGES_HOSTNAME are what
      # jekyll-github-metadata resolves `site.github` from, which
      # _layouts/default.html reads for the footer, the profile link and
      # the address of every project in the sidebar. `user_page?` in
      # jekyll-github-metadata's repository.rb compares the repository
      # name against `<owner>.<pages_hostname>`, and pages.rb falls back
      # to `localhost:4000` where PAGES_PAGES_HOSTNAME is unset -- so
      # without it this job renders the layout's *project*-page branch,
      # the one Pages does not serve, instead of the *user*-page branch
      # the layout the site is served with. Neither variable needs a token
      - name: Build the site
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          PAGES_PAGES_HOSTNAME: github.io
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --strict_front_matter --baseurl "$BASE_PATH"
      # the defect the build cannot report on itself. A layout whose
      # baseurl is empty renders `{{ '/x' | relative_url }}` as `/%20/x`
      # and jekyll exits zero, so the page is served with a script tag
      # pointing at a path nothing answers. btclib-org/btclib's site
      # served exactly that for as long as it took somebody to read the
      # HTML. The build is the claim about the sources; this is the same
      # claim made about the artifact.
      #
      # An attribute of a real tag, not the string anywhere on the page:
      # a page describing the defect carries it with the `<` escaped as
      # `&lt;`, so requiring an unescaped `<tag ... src="` is what
      # separates the page that has the bug from the page that describes
      # it
      - name: The built pages carry no encoded-space URL
        run: |
          if grep -rEn '<[a-zA-Z]+[^>]+(src|href)="[^"]*%20' \
              _site --include='*.html'; then
            echo "::error::a built page carries %20 in a src or href"
            exit 1
          fi
      # the homepage is index.md rendered, and _config.yml's exclude list
      # is what decides that: an entry added there by mistake -- index.md
      # itself -- leaves a site that builds and serves nothing, which is
      # a green build and a 404 for every visitor.
      #
      # The grep is the other half, and it asks about the layout rather
      # than about the theme: a page whose front matter names no layout
      # renders as its markdown body alone and still writes index.html,
      # a fragment with no document around it. `<html` is what any
      # layout puts there and a body-only render cannot, so this stays
      # true of whatever theme the site carries
      - name: The homepage is rendered through a layout
        run: |
          test -s _site/index.html
          grep -q '<html' _site/index.html
      # what this tree adds to that layout, asked of the artifact rather
      # than of the sources. check-theme-copies.sh compares the layout
      # with the gem's and cannot see a fenced block removed whole: the
      # fences go with it, the count stays even and the remainder stays
      # equal, so the one thing that reports a sidebar or a footer
      # quietly losing what it is for is the page itself.
      # A class attribute rather than the text: the labels are prose and
      # will be rewritten, where a class is what the stylesheet and the
      # layout already have to agree on
      - name: The built homepage carries the projects and the supporters
        run: |
          grep -q 'class="projects"' _site/index.html
          grep -q 'class="supporters"' _site/index.html
          grep -q 'class="supporters-note"' _site/index.html
      # btclib.org may be served under a Content-Security-Policy, which
      # the layout and the project pages have to hold under. The check
      # allows same-origin loads only, which is stricter than the policy;
      # its header says what it reads and what it leaves out
      - name: The built pages hold under a same-origin policy
        run: .github/scripts/check-built-pages.sh
      # the site builds whether or not anything answers an image's src:
      # an SVG the derivation did not write, or a file the exclude list
      # keeps out, is a broken image on a green run. Read off the built
      # page rather than off index.md, the src there being what a browser
      # asks for -- written as the markdown has it, `./<name>` included, which
      # the loop strips -- and every src with no scheme and no host is this site's, the
      # supporters' logos included. The loop is the pipeline's last
      # command, so its `exit 1` is the step's status
      - name: Every image the built homepage serves from here is built
        run: |
          grep -oE '<img [^>]*src="[^"]+"' _site/index.html \
            | sed -E 's/.*src="([^"]+)"/\1/' \
            | grep -vE '^([a-z][a-z0-9+.-]*:|//)' \
            | while read -r src; do
                path=${src#./}
                path=${path#/}
                test -s "_site/$path" || {
                  echo "::error::_site/index.html shows $src, which the build lacks"
                  exit 1
                }
                echo "_site/index.html shows $src, and the build has it"
              done
      # the stylesheet's cache-buster is `site.github.build_revision`, and
      # a build that cannot resolve it writes `?v=` with nothing after it:
      # the same URL for every release, so a browser keeps the old
      # stylesheet. The value is the commit this run built
      - name: The stylesheet link carries the revision built
        env:
          REVISION: ${{ github.sha }}
        run: |
          grep -q "assets/css/style.css?v=${REVISION}\"" _site/index.html
      # only a push or a dispatch on main deploys. The artifact is what the
      # job above built and checked
      - name: Upload the site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy the website
    needs: website
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the only job that may write to Pages
    permissions:
      pages: write # deploy-pages publishes the artifact
      id-token: write # deploy-pages proves to Pages that the run is this repository's
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
