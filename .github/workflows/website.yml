---
name: website

# https://btclib.org/ is this repository's own root, served by
# GitHub Pages from main with the classic builder --
# `gh api repos/btclib-org/btclib-org.github.io/pages` answers
# `build_type: legacy`, and REPOSITORY.md records the setting. That
# builder is the reason this workflow exists: it runs on GitHub's side,
# writes no log a maintainer can read, and reports a failure nowhere. A
# layout it cannot render is served broken until somebody fetches the
# page and reads the HTML.
#
# So the build is done here as well, where it can fail out loud. Not a
# required check: it carries a `paths` filter, and a required check that
# produces no run blocks a merge where a skipped one satisfies it. What
# it buys without being required is a red X on the pull request that
# breaks the site, which is earlier than a visitor finding it.
#
# The gem, the ruby and the theme are the ones Pages itself runs, and
# https://pages.github.com/versions.json is what says so rather than a
# guess repeated here: `github-pages` pins its own dependency set
# exactly, so the Gemfile naming that one version is the whole of the
# lock -- there is no Gemfile.lock to commit and none to keep in step.
# Dependabot's bundler ecosystem moves it, which makes a Pages toolchain
# upgrade a pull request that builds the site with it before anything is
# merged.

on:
  push:
    # main only, for the reason lint.yml gives at the same key: a push to
    # a branch with an open pull request would run this twice, in two
    # concurrency groups that do not cancel each other, and the
    # pull_request run is the one worth keeping. On main it asks the
    # question of the commit a merge creates, which is the commit Pages
    # actually builds
    branches: [main]
    # what a Jekyll build reads, and nothing else. index.md is the
    # homepage, _config.yml decides what else in the root is published at
    # all, _layouts holds the theme layout this tree carries its own copy
    # of, assets holds the stylesheet and the images that copy points at,
    # and CNAME is copied into the built site, which is where Pages reads
    # the custom domain from. The script is here because the job runs it
    # and it can fail on its own. Written out twice rather than through
    # a yaml anchor, which the workflow parser does not promise
    paths:
      - index.md
      - _config.yml
      - _layouts/**
      - assets/**
      - CNAME
      - Gemfile
      - .github/scripts/check-theme-copies.sh
      - .github/workflows/website.yml
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft. closed too,
    # though the job below declines the real work on it: the landing then
    # lands in this pull request's own concurrency group and cancels the
    # run still holding it
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - index.md
      - _config.yml
      - _layouts/**
      - assets/**
      - CNAME
      - Gemfile
      - .github/scripts/check-theme-copies.sh
      - .github/workflows/website.yml
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet, and the way to ask the question after a Pages upgrade
  # that touched no file here
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch or pull request. The group is
# named literally rather than with github.workflow, which in a called
# workflow is the caller's name
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Build the website
    # a draft pull request is work in progress and spends no runner here
    # either. A closed one spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a minute of bundler and seconds of jekyll; a job that takes ten is
    # hung rather than slow
    timeout-minutes: 15
    steps:
      # every action is pinned to a commit SHA, the tag in the comment
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the build reads the tree and nothing pushes it back
          persist-credentials: false
      # the ruby Pages runs, from the same versions.json the Gemfile
      # names: a build that passes here on a ruby Pages does not have
      # says nothing about the site GitHub serves.
      # bundler-cache installs the gems and caches them, keyed by the
      # Gemfile -- a fresh resolve every run would spend a minute on a
      # dependency set that only moves when dependabot moves it
      - name: Set up ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      # the theme files this tree keeps its own copies of, which are
      # what a github-pages bump can falsify in silence: the gem moves,
      # the site still builds, and the page serves the chrome of a
      # release nobody runs, or a stylesheet missing half of itself.
      # Before the build rather than after, this being a question about
      # the sources; the script says which files it compares and how
      # each one's own additions are left out of the comparison
      - name: The theme files this tree copies are the theme's own
        run: .github/scripts/check-theme-copies.sh
      # PAGES_REPO_NWO is what jekyll-github-metadata resolves
      # `site.github` from, which _layouts/default.html reads for the
      # footer, the profile link and the address of every project in the
      # sidebar. Unauthenticated, so the fields it cannot reach without a
      # token are empty rather than wrong -- the claim this job makes is
      # that the site builds and its own links are well formed, not that
      # the metadata GitHub injects on its side is present here
      - name: Build the site
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build --strict_front_matter
      # the defect the build cannot report on itself. A layout whose
      # baseurl is empty renders `{{ '/x' | relative_url }}` as `/%20/x`
      # and jekyll exits zero, so the page is served with a script tag
      # pointing at a path nothing answers. btclib-org/btclib's site
      # served exactly that for as long as it took somebody to read the
      # HTML. The build is the claim about the sources; this is the same
      # claim made about the artifact.
      #
      # An attribute of a real tag, not the string anywhere on the page:
      # a page describing the defect carries it with the `<` escaped as
      # `&lt;`, so requiring an unescaped `<tag ... src="` is what
      # separates the page that has the bug from the page that describes
      # it
      - name: The built pages carry no encoded-space URL
        run: |
          if grep -rEn '<[a-zA-Z]+[^>]+(src|href)="[^"]*%20' \
              _site --include='*.html'; then
            echo "::error::a built page carries %20 in a src or href"
            exit 1
          fi
      # the homepage is index.md rendered, and _config.yml's exclude list
      # is what decides that: an entry added there by mistake -- index.md
      # itself -- leaves a site that builds and serves nothing, which is
      # a green build and a 404 for every visitor.
      #
      # The grep is the other half, and it asks about the layout rather
      # than about the theme: a page whose front matter names no layout
      # renders as its markdown body alone and still writes index.html,
      # a fragment with no document around it. `<html` is what any
      # layout puts there and a body-only render cannot, so this stays
      # true of whatever theme the site carries
      - name: The homepage is rendered through a layout
        run: |
          test -s _site/index.html
          grep -q '<html' _site/index.html
      # what this tree adds to that layout, asked of the artifact rather
      # than of the sources. check-theme-copies.sh compares the layout
      # with the gem's and cannot see a fenced block removed whole: the
      # fences go with it, the count stays even and the remainder stays
      # equal, so the one thing that reports a sidebar or a footer
      # quietly losing what it is for is the page itself.
      # A class attribute rather than the text: the labels are prose and
      # will be rewritten, where a class is what the stylesheet and the
      # layout already have to agree on
      - name: The built homepage carries the projects and the supporters
        run: |
          grep -q 'class="projects"' _site/index.html
          grep -q 'class="supporters"' _site/index.html
      # Pages reads the custom domain from the *built* site, so an
      # exclude entry, a rename or a deletion that keeps CNAME out of
      # _site releases btclib.org on the next build -- and releases it
      # the way this workflow exists to catch, with a green build and no
      # log anywhere saying so. The value is asserted and not only the
      # file's presence: a CNAME holding some other name hands the
      # domain over just as completely
      - name: The built site claims btclib.org
        run: |
          test "$(cat _site/CNAME)" = "btclib.org"
